<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1622" />
    <script src="/analytics.js"></script>

    <title>Rotion App — Motion made simple</title>
    <meta
      name="description"
      content="Rotion App: a browser-based motion-design tool — pick from 41+ templates, add your images, and export a looping video up to 8K. Full Arabic RTL support, nothing uploaded to any server."
    />
    <meta
      name="keywords"
      content="motion design, animated video, motion templates, Arabic motion, RTL video, تصميم حركة, موشن جرافيك, فيديو متحرك, قوالب موشن"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://rotionapp.com/" />
    <!-- Bilingual routing: this document is the English default; /ar is the Arabic
         equivalent (see scripts/prerender.mjs). x-default points to English. -->
    <link rel="alternate" hreflang="en" href="https://rotionapp.com/" />
    <link rel="alternate" hreflang="ar" href="https://rotionapp.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://rotionapp.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rotion App" />
    <meta property="og:title" content="Rotion App — Motion made simple" />
    <meta
      property="og:description"
      content="A browser-based motion-design tool: pick a template, add your images, and export a looping video up to 8K. Full Arabic RTL support."
    />
    <meta property="og:url" content="https://rotionapp.com/" />
    <meta property="og:image" content="https://rotionapp.com/og-image.svg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rotion App — Motion made simple" />
    <meta
      name="twitter:description"
      content="A browser-based motion-design tool: pick a template, add your images, and export a looping video up to 8K."
    />
    <meta name="twitter:image" content="https://rotionapp.com/og-image.svg" />

    <!-- Structured data (Organization + software + pricing + FAQ) for Google + AI engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://rotionapp.com/#org",
            "name": "Rotion App",
            "url": "https://rotionapp.com/",
            "logo": "https://rotionapp.com/icon-rotion-02.png",
            "email": "support@rotionapp.com",
            "slogan": "Motion made simple"
          },
          {
            "@type": "WebApplication",
            "@id": "https://rotionapp.com/#app",
            "name": "Rotion App",
            "url": "https://rotionapp.com/",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Web browser",
            "browserRequirements": "Requires a modern browser (Chrome, Edge)",
            "description": "Browser-based motion-design tool: pick a template, add your images, and export a looping video up to 8K. Full Arabic RTL support. Runs entirely in the browser — nothing uploaded.",
            "inLanguage": ["en", "ar"],
            "publisher": { "@id": "https://rotionapp.com/#org" },
            "featureList": [
              "41+ motion templates",
              "Arabic RTL text & fonts",
              "Export up to 8K (MP4 / WebM)",
              "Custom logo watermark",
              "Custom font upload",
              "Runs 100% in the browser"
            ],
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "USD",
                "description": "Free plan with core templates and 720p export."
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "9",
                "priceCurrency": "USD",
                "description": "Pro plan: all templates, 8K export, no app watermark.",
                "url": "https://rotionapp.com/"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://rotionapp.com/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Rotion App?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Rotion App is a motion-design tool that runs entirely in your browser: pick a template, add your images, and export an animated video. All processing happens on your device — your images are never uploaded to a server."
                }
              },
              {
                "@type": "Question",
                "name": "Does it support Arabic?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — Rotion App has full Arabic RTL text support with professional Arabic fonts such as Cairo and Tajawal."
                }
              },
              {
                "@type": "Question",
                "name": "What's the maximum export resolution?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The Free plan exports up to 720p, and the Pro plan exports up to 8K in MP4 or WebM."
                }
              },
              {
                "@type": "Question",
                "name": "Is it free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "There's a permanently free plan, and a Pro plan at $9/month that unlocks 8K export, watermark removal, and more."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Crawlable fallback for engines that don't execute JavaScript. -->
    <noscript>
      <div style="max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; color: #e8eef5; background: #0a1622">
        <h1>Rotion App — Motion made simple</h1>
        <p>
          Rotion App is a browser-based motion-design tool: pick a template, add your images, and
          export a looping video up to 8K. Full Arabic RTL support. Runs entirely in your browser.
        </p>
        <p>
          Rotion App أداة تصميم حركة تعمل بالكامل في متصفحك: اختر قالباً من أكثر من 41 قالباً، أضف
          صورك، وصدّر فيديو متحرك حتى دقة 8K — بدعم عربي RTL كامل، ودون رفع أي صورة إلى خادم.
          (<a href="/ar" style="color: #00e5a0">بالعربية</a>)
        </p>
        <p>
          <a href="/terms" style="color: #00e5a0">Terms</a> ·
          <a href="/privacy" style="color: #00e5a0">Privacy</a> ·
          <a href="/refund" style="color: #00e5a0">Refunds</a> ·
          <a href="/contact" style="color: #00e5a0">Contact</a>
        </p>
      </div>
    </noscript>

    <!-- Marketing landing page (front door); the studio boots on "Launch". -->
    <div id="landing"></div>

    <div id="app" class="hidden">
      <!-- Top bar -->
      <header class="topbar">
        <button class="brand" id="brand-home" title="Home">
          <img class="brand-icon" src="/icon-rotion-02.png" alt="" width="28" height="28" />
          <span class="brand-name">Rotion App</span>
        </button>
        <div class="topbar-actions">
          <button class="btn" id="btn-account">Sign in</button>
          <button class="btn" id="btn-lang" title="Toggle language">ع</button>
          <button class="btn" id="btn-home">Home</button>
          <button class="btn" id="btn-projects">My projects</button>
          <button class="btn btn-primary" id="btn-export">Export</button>
        </div>
      </header>

      <main class="workspace">
        <!-- Left: settings panel (controls + media + background) -->
        <aside class="panel" id="panel" aria-label="Settings">
          <div id="panel-controls"></div>
          <div id="panel-media"></div>
          <div id="panel-text"></div>
          <div id="panel-audio"></div>
          <div id="panel-watermark"></div>
          <div id="panel-background"></div>
        </aside>

        <!-- Center: canvas stage -->
        <section class="stage" id="stage">
          <div class="stage-canvas-wrap" id="stage-canvas-wrap">
            <canvas id="preview-canvas"></canvas>
            <div class="stage-hint" id="stage-hint">
              <p>Drop an image anywhere to start.</p>
            </div>
          </div>
          <div class="stage-timeline" id="stage-timeline"></div>
          <div class="stage-footer">
            <span id="stage-meta" class="stage-meta"></span>
          </div>
        </section>

        <!-- Right: template gallery -->
        <aside class="gallery" id="gallery" aria-label="Templates"></aside>
      </main>
    </div>

    <input id="file-input" type="file" accept="image/*" hidden />
    <input id="slot-input" type="file" accept="image/*" hidden />
    <input id="wm-input" type="file" accept="image/*" hidden />
    <input id="bg-input" type="file" accept="image/*" hidden />
    <input id="font-input" type="file" accept=".ttf,.otf,.woff,.woff2,font/*" hidden />
    <input id="audio-input" type="file" accept="audio/*" hidden />
    <audio id="preview-audio" loop hidden></audio>

    <!-- Modal host -->
    <div id="modal-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
