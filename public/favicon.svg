<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rotion">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#00E5A0" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A1622" />
  <!-- motion streak -->
  <path d="M8 26 h20" stroke="url(#r)" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M6 33 h14" stroke="url(#r)" stroke-width="3" stroke-linecap="round" opacity="0.3" />
  <!-- R letterform -->
  <text x="52%" y="55%" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="40"
        fill="url(#r)">R</text>
